<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<style>
  @import url('https://fonts.googleapis.com/css2?family=Manrope:wght@500;700;800&display=swap');
  * { margin:0; padding:0; box-sizing:border-box; }
  body { width:1888px; height:1072px; position:relative; font-family:'Manrope',sans-serif; overflow:hidden; }
  img.bg { position:absolute; top:0; left:0; width:1888px; height:1072px; }

  .title { position:absolute; top:60px; left:70px; }
  .title h1 { font-size:64px; font-weight:800; color:#16120D; line-height:1.05; text-transform:uppercase; }
  .title .sub { margin-top:14px; font-size:22px; font-weight:700; letter-spacing:0.08em; text-transform:uppercase; color:#1F7A3D; }

  .num { position:absolute; width:264px; text-align:center; top:501px; height:96px; display:flex; align-items:center; justify-content:center; }
  .num span { font-size:44px; font-weight:800; color:#1F7A3D; }
  .num.n1 { left:774px; }
  .num.n2 { left:1130px; width:216px; }
  .num.n3 { left:1432px; width:224px; }

  .lbl { position:absolute; top:606px; text-align:center; font-size:20px; font-weight:700; color:#4A4339; }
  .lbl.l1 { left:774px; width:264px; padding-left:24px; }
  .lbl.l2 { left:1130px; width:216px; }
  .lbl.l3 { left:1432px; width:224px; }

  .logo { position:absolute; bottom:36px; right:60px; height:56px; }
</style>
</head>
<body>
  <img class="bg" src="board_raw.jpg">

  <div class="title">
    <h1>Кейс:<br>Сервис по SEO</h1>
    <div class="sub">Выход на владельцев бизнеса в Telegram</div>
  </div>

  <div class="num n1"><span>2 431</span></div>
  <div class="num n2"><span>316</span></div>
  <div class="num n3"><span>78</span></div>

  <div class="lbl l1">отправок</div>
  <div class="lbl l2">диалогов</div>
  <div class="lbl l3">квал. лидов</div>

  <img class="logo" src="leadget_logo.png">
</body>
</html>
