name: AutoPost

on:
  schedule:
    - cron: '0 7-17 * * *' # каждый час 10:00–20:00 МСК (07:00–17:00 UTC)
  workflow_dispatch:
    inputs:
      job:
        description: 'Which job to run'
        required: false
        default: 'post'
        type: choice
        options:
          - post
          - post-row
          - delete-row
          - init-sheets
          - scan-cases
          - test-case
          - test-feature
          - test-news
          - learn
          - gen-pen-pose
          - generate-article
      test_case_token:
        description: 'Токен кампании для теста (только для test-case)'
        required: false
        default: ''
      test_case_title:
        description: 'Название клиента для теста'
        required: false
        default: ''
      test_case_data:
        description: 'JSON данные кейса (niche/task/mechanics/price)'
        required: false
        default: '{}'
      test_feature_title:
        description: 'Название фичи (только для test-feature)'
        required: false
        default: ''
      test_feature_problem:
        description: 'Какая была проблема (только для test-feature)'
        required: false
        default: ''
      test_feature_description:
        description: 'Что сделали, как работает (только для test-feature)'
        required: false
        default: ''
      test_news_text:
        description: 'Готовый текст новости для прямого поста (только для test-news)'
        required: false
        default: ''
      plan_row:
        description: 'Номер строки ContentPlan для публикации вне очереди (только для post-row)'
        required: false
        default: ''
      news_row:
        description: 'Номер строки News, из которой сгенерировать статью (только для generate-article)'
        required: false
        default: ''
      topic:
        description: 'Свободная тема для статьи, если без привязки к новости (только для generate-article)'
        required: false
        default: ''
      platform:
        description: 'Площадка статьи: habr/vc/dzen/x (только для generate-article)'
        required: false
        default: ''

jobs:
  init-sheets:
    if: github.event.inputs.job == 'init-sheets'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm ci
      - run: npm run init-sheets
        env:
          GOOGLE_SHEET_ID: ${{ secrets.GOOGLE_SHEET_ID }}
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}

  scan-cases:
    if: github.event.inputs.job == 'scan-cases'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm ci
      - run: npm run scan-cases
        env:
          LEADGET_ADMIN_TOKEN: ${{ secrets.LEADGET_ADMIN_TOKEN }}
          GOOGLE_SHEET_ID: ${{ secrets.GOOGLE_SHEET_ID }}
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}

  test-case:
    if: github.event.inputs.job == 'test-case'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm ci
      - run: npm run autopost
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          OPENROUTER_MODEL: ${{ vars.OPENROUTER_MODEL }}
          REPLICATE_API_TOKEN: ${{ secrets.REPLICATE_API_TOKEN }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_SESSION: ${{ secrets.TELEGRAM_SESSION }}
          TELEGRAM_API_ID: ${{ secrets.TELEGRAM_API_ID }}
          TELEGRAM_API_HASH: ${{ secrets.TELEGRAM_API_HASH }}
          GOOGLE_SHEET_ID: ${{ secrets.GOOGLE_SHEET_ID }}
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          POST_CHANNEL: '@LeadGet_reviews'
          SKIP_IMAGE: ${{ secrets.SKIP_IMAGE }}
          TEST_CASE_TOKEN: ${{ github.event.inputs.test_case_token }}
          TEST_CASE_TITLE: ${{ github.event.inputs.test_case_title }}
          TEST_CASE_DATA: ${{ github.event.inputs.test_case_data }}

  test-feature:
    if: github.event.inputs.job == 'test-feature'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm ci
      - run: npm run autopost
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          OPENROUTER_MODEL: ${{ vars.OPENROUTER_MODEL }}
          REPLICATE_API_TOKEN: ${{ secrets.REPLICATE_API_TOKEN }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_SESSION: ${{ secrets.TELEGRAM_SESSION }}
          TELEGRAM_API_ID: ${{ secrets.TELEGRAM_API_ID }}
          TELEGRAM_API_HASH: ${{ secrets.TELEGRAM_API_HASH }}
          GOOGLE_SHEET_ID: ${{ secrets.GOOGLE_SHEET_ID }}
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          POST_CHANNEL: '@LeadGet_reviews'
          SKIP_IMAGE: ${{ secrets.SKIP_IMAGE }}
          TEST_FEATURE_TITLE: ${{ github.event.inputs.test_feature_title }}
          TEST_FEATURE_PROBLEM: ${{ github.event.inputs.test_feature_problem }}
          TEST_FEATURE_DESCRIPTION: ${{ github.event.inputs.test_feature_description }}

  test-news:
    if: github.event.inputs.job == 'test-news'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm ci
      - run: npm run autopost
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          OPENROUTER_MODEL: ${{ vars.OPENROUTER_MODEL }}
          REPLICATE_API_TOKEN: ${{ secrets.REPLICATE_API_TOKEN }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_SESSION: ${{ secrets.TELEGRAM_SESSION }}
          TELEGRAM_API_ID: ${{ secrets.TELEGRAM_API_ID }}
          TELEGRAM_API_HASH: ${{ secrets.TELEGRAM_API_HASH }}
          GOOGLE_SHEET_ID: ${{ secrets.GOOGLE_SHEET_ID }}
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          POST_CHANNEL: '@LeadGet_reviews'
          SKIP_IMAGE: ${{ secrets.SKIP_IMAGE }}
          TEST_NEWS_TEXT: ${{ github.event.inputs.test_news_text }}

  gen-pen-pose:
    if: github.event.inputs.job == 'gen-pen-pose'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm ci
      - run: npx tsx src/_genPenPose.ts
        env:
          REPLICATE_API_TOKEN: ${{ secrets.REPLICATE_API_TOKEN }}
      - uses: actions/upload-artifact@v4
        with:
          name: pen-pose
          path: pen_pose_*.png

  learn:
    if: github.event.inputs.job == 'learn'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm ci
      - run: npm run learn
        env:
          GOOGLE_SHEET_ID: ${{ secrets.GOOGLE_SHEET_ID }}
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}

  post-row:
    if: github.event.inputs.job == 'post-row'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm ci
      - run: npm run autopost
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          OPENROUTER_MODEL: ${{ vars.OPENROUTER_MODEL }}
          REPLICATE_API_TOKEN: ${{ secrets.REPLICATE_API_TOKEN }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_SESSION: ${{ secrets.TELEGRAM_SESSION }}
          TELEGRAM_API_ID: ${{ secrets.TELEGRAM_API_ID }}
          TELEGRAM_API_HASH: ${{ secrets.TELEGRAM_API_HASH }}
          GOOGLE_SHEET_ID: ${{ secrets.GOOGLE_SHEET_ID }}
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          POST_CHANNEL: '@LeadGet_reviews'
          SKIP_IMAGE: ${{ secrets.SKIP_IMAGE }}
          FORCE_ROW: ${{ github.event.inputs.plan_row }}

  delete-row:
    if: github.event.inputs.job == 'delete-row'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm ci
      - run: npm run delete-post
        env:
          TELEGRAM_SESSION: ${{ secrets.TELEGRAM_SESSION }}
          TELEGRAM_API_ID: ${{ secrets.TELEGRAM_API_ID }}
          TELEGRAM_API_HASH: ${{ secrets.TELEGRAM_API_HASH }}
          GOOGLE_SHEET_ID: ${{ secrets.GOOGLE_SHEET_ID }}
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          POST_CHANNEL: '@LeadGet_reviews'
          DELETE_ROW: ${{ github.event.inputs.plan_row }}

  generate-article:
    if: github.event.inputs.job == 'generate-article'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm ci
      - run: npm run generate-article
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          OPENROUTER_MODEL: ${{ vars.OPENROUTER_MODEL }}
          GOOGLE_SHEET_ID: ${{ secrets.GOOGLE_SHEET_ID }}
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          NEWS_ROW: ${{ github.event.inputs.news_row }}
          TOPIC: ${{ github.event.inputs.topic }}
          PLATFORM: ${{ github.event.inputs.platform }}

  post:
    if: github.event.inputs.job == 'post' || github.event_name == 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm ci
      - run: npm run autopost
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          OPENROUTER_MODEL: ${{ vars.OPENROUTER_MODEL }}
          REPLICATE_API_TOKEN: ${{ secrets.REPLICATE_API_TOKEN }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_SESSION: ${{ secrets.TELEGRAM_SESSION }}
          TELEGRAM_API_ID: ${{ secrets.TELEGRAM_API_ID }}
          TELEGRAM_API_HASH: ${{ secrets.TELEGRAM_API_HASH }}
          GOOGLE_SHEET_ID: ${{ secrets.GOOGLE_SHEET_ID }}
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          POST_CHANNEL: '@LeadGet_reviews'
          SKIP_IMAGE: ${{ secrets.SKIP_IMAGE }}
