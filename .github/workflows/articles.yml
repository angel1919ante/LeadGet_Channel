name: Generate Articles

# Общая группа со всеми остальными workflow'ами — делят одну Telegram-сессию
# (MTProto), параллельный запуск ломает сессию. cancel-in-progress: false —
# новый запуск встаёт в очередь, а не отменяет/не бежит поверх текущего.
concurrency:
  group: telegram-mtproto
  cancel-in-progress: false

on:
  schedule:
    # Каждые 3 дня в 09:00 МСК (06:00 UTC)
    - cron: '0 6 */3 * *'
  workflow_dispatch:

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm ci
      - run: npm run generate:articles
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          OPENROUTER_MODEL: ${{ vars.OPENROUTER_MODEL }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_USER_ID: ${{ secrets.TELEGRAM_USER_ID }}
          GOOGLE_SHEET_ID: ${{ secrets.GOOGLE_SHEET_ID }}
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
